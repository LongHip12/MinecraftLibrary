{% extends "base.html" %}
{% block title %}Forgot Password — Lonely Hub{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="/static/css/auth.css">
{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="https://i.imgur.com/xY7M2iE.jpeg" alt="Lonely Hub">
      <span class="auth-logo-text">Lonely Hub</span>
    </div>
    <h1 class="auth-title">Reset password</h1>
    <p class="auth-sub">Enter your email and we'll send a verification code</p>
    <div class="auth-error" id="auth-error" style="display:none;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
      <span></span>
    </div>
    <div class="auth-success" id="auth-success" style="display:none;background:rgba(74,222,128,0.08);border:1px solid rgba(74,222,128,0.2);border-radius:10px;padding:12px 14px;display:none;align-items:center;gap:8px;color:#4ade80;font-size:13px;margin-bottom:12px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
      <span></span>
    </div>
    <form class="auth-form" id="forgot-form">
      <div class="form-group">
        <label class="form-label">Email address</label>
        <input type="email" name="email" id="fp-email" class="input-field" placeholder="Enter your account email" required autocomplete="email">
      </div>
      <button type="submit" class="auth-submit-btn" id="send-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        <span>Send Code</span>
      </button>
    </form>
    <div class="auth-link"><a href="/login">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      Back to Sign In
    </a></div>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
document.getElementById('forgot-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  var btn = document.getElementById('send-btn');
  var errEl = document.getElementById('auth-error');
  var sucEl = document.getElementById('auth-success');
  var email = document.getElementById('fp-email').value.trim();
  errEl.style.display = 'none';
  sucEl.style.display = 'none';
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div> Sending...';
  try {
    var resp = await fetch('/api/send-otp', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ email: email, purpose: 'reset' })
    });
    var data = await resp.json();
    if (data.success) {
      sucEl.querySelector('span').textContent = 'Code sent! Check your inbox.';
      sucEl.style.display = 'flex';
      setTimeout(function() {
        window.location.href = '/reset-password?email=' + encodeURIComponent(email);
      }, 1200);
    } else {
      errEl.querySelector('span').textContent = data.error || 'Failed to send code';
      errEl.style.display = 'flex';
      btn.disabled = false;
      btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg> <span>Send Code</span>';
    }
  } catch(err) {
    errEl.querySelector('span').textContent = 'Network error. Please try again.';
    errEl.style.display = 'flex';
    btn.disabled = false;
    btn.innerHTML = '<span>Send Code</span>';
  }
});
</script>
{% endblock %}
