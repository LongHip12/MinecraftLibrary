{% extends "base.html" %}
{% block title %}Admin Dashboard — Lonely Hub{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="/static/css/dashboard.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  var form = document.getElementById('rateLimitForm');
  if (form) {
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      var val = parseInt(document.getElementById('rateLimitInput').value);
      if (!val || val < 1) return;
      var btn = e.target.querySelector('button[type=submit]');
      btn.disabled = true; btn.textContent = 'Saving...';
      fetch('/api/admin/rate-limit', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({api_rate_limit: val})
      }).then(function(r){return r.json();}).then(function(d){
        btn.disabled = false; btn.textContent = 'Save';
        if (d.success) {
          var msg = document.getElementById('rateLimitMsg');
          msg.style.display = 'inline';
          setTimeout(function(){ msg.style.display = 'none'; }, 2000);
        }
      }).catch(function(){ btn.disabled = false; btn.textContent = 'Save'; });
    });
  }

  document.getElementById('saveDataBtn').addEventListener('click', downloadData);
  document.getElementById('cloudBackupBtn').addEventListener('click', backupToCloud);
  checkSupabaseConfig();
  loadBackupFull();
});
});

var ICON_DL = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>';
var ICON_CLOUD = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 16 12 12 8 16"></polyline><line x1="12" y1="12" x2="12" y2="21"></line><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"></path></svg>';

function downloadData() {
  var btn = document.getElementById('saveDataBtn');
  btn.disabled = true;
  btn.innerHTML = ICON_DL + ' Downloading...';
  window.location.href = '/api/admin/save-data';
  setTimeout(function(){
    btn.disabled = false;
    btn.innerHTML = ICON_DL + ' Download Backup';
    loadBackupFull();
  }, 4000);
}

function backupToCloud() {
  var btn = document.getElementById('cloudBackupBtn');
  btn.disabled = true;
  btn.innerHTML = ICON_CLOUD + ' Saving...';
  fetch('/api/admin/backup-to-cloud', {method:'POST'})
    .then(function(r){return r.json();})
    .then(function(d){
      btn.disabled = false;
      btn.innerHTML = ICON_CLOUD + ' Save to Cloud';
      if (d.success) {
        showBackupMsg('✓ Saved to Supabase!', '#22c55e');
        loadBackupFull();
      } else if (d.error && d.error.indexOf('not configured') !== -1) {
        showBackupMsg('✗ Set SUPABASE_URL & SUPABASE_SERVICE_KEY env vars', '#f59e0b');
      } else {
        showBackupMsg('✗ Error: ' + d.error, '#ef4444');
      }
    })
    .catch(function(){ btn.disabled = false; btn.innerHTML = ICON_CLOUD + ' Save to Cloud'; showBackupMsg('✗ Connection error', '#ef4444'); });
}

function showBackupMsg(text, color) {
  var el = document.getElementById('backupActionMsg');
  el.textContent = text;
  el.style.color = color;
  el.style.display = 'inline';
  setTimeout(function(){ el.style.display = 'none'; }, 3000);
}

function updateLastBackupStatus(b, notConfigured) {
  var dot  = document.getElementById('lbsDot');
  var time = document.getElementById('lbsTime');
  var lbl  = document.getElementById('lbsLabel');
  var idEl = document.getElementById('lbsId');
  if (!dot) return;
  if (notConfigured) {
    dot.style.background = '#f59e0b';
    time.textContent = 'Supabase not configured';
    lbl.style.display = 'none';
    idEl.textContent = '—';
    return;
  }
  if (!b) {
    dot.style.background = '#334155';
    time.textContent = 'No backups yet';
    lbl.style.display = 'none';
    idEl.textContent = '—';
    return;
  }
  var dt = new Date(b.created_at);
  var isAuto = b.label === 'Auto';
  dot.style.background = '#22c55e';
  time.textContent = dt.toLocaleString();
  lbl.style.display = 'inline';
  lbl.textContent = b.label;
  lbl.style.background = isAuto ? '#1e293b' : '#1e3a5f';
  lbl.style.color      = isAuto ? '#94a3b8' : '#60a5fa';
  idEl.textContent = b.id.slice(0, 8) + '…';
  idEl.title = b.id;
}

function checkSupabaseConfig() {
  fetch('/api/admin/supabase-status')
    .then(function(r){ return r.json(); })
    .then(function(d){
      var cloudBtn = document.getElementById('cloudBackupBtn');
      var notice   = document.getElementById('supabaseSetupNotice');
      if (!d.configured) {
        updateLastBackupStatus(null, true);
        if (cloudBtn) {
          cloudBtn.disabled = true;
          cloudBtn.style.opacity = '0.4';
          cloudBtn.style.cursor = 'not-allowed';
          cloudBtn.title = 'Set SUPABASE_URL and SUPABASE_SERVICE_KEY env vars first';
        }
        if (notice) notice.style.display = 'flex';
        document.getElementById('bhTableBody').innerHTML =
          '<div style="padding:24px;text-align:center;color:var(--text3);font-size:12px;">Supabase not configured.</div>';
      } else {
        if (notice) notice.style.display = 'none';
        loadBackupFull();
      }
    })
    .catch(function(){ loadBackupFull(); });
}

function loadBackupFull() {
  var list = document.getElementById('backupList');
  if (!list) return;
  list.innerHTML = '<div style="color:var(--text3);font-size:12px;">Loading...</div>';
  fetch('/api/admin/backups')
    .then(function(r){return r.json();})
    .then(function(d){
      if (!d.success || !d.backups.length) {
        list.innerHTML = '<div style="color:var(--text3);font-size:12px;">No backups yet.</div>';
        updateLastBackupStatus(null);
        return;
      }
      updateLastBackupStatus(d.backups[0]);
      list.innerHTML = d.backups.map(function(b){
        var dt = new Date(b.created_at);
        var dtStr = dt.toLocaleString();
        var label = b.label === 'Auto'
          ? '<span style="font-size:10px;background:#334155;color:#94a3b8;border-radius:4px;padding:1px 6px;">Auto</span>'
          : '<span style="font-size:10px;background:#1e3a5f;color:#60a5fa;border-radius:4px;padding:1px 6px;">Manual</span>';
        return '<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px;">'
          + label
          + '<span style="flex:1;color:var(--text2);">' + dtStr + '</span>'
          + '<button class="bk-restore" data-id="' + b.id + '" data-label="' + dtStr + '" title="Restore this backup" style="padding:3px 10px;border-radius:6px;background:#0f4c81;color:#60a5fa;border:none;cursor:pointer;font-size:11px;font-family:inherit;">Restore</button>'
          + '<button class="bk-delete" data-id="' + b.id + '" title="Delete this backup" style="padding:3px 8px;border-radius:6px;background:#450a0a;color:#f87171;border:none;cursor:pointer;font-size:11px;font-family:inherit;">✕</button>'
          + '</div>';
      }).join('');
      list.querySelectorAll('.bk-restore').forEach(function(btn){
        btn.addEventListener('click', function(){ restoreBackup(btn.dataset.id, btn.dataset.label); });
      });
      list.querySelectorAll('.bk-delete').forEach(function(btn){
        btn.addEventListener('click', function(){ deleteBackup(btn.dataset.id, btn); });
      });
    })
    .catch(function(){ list.innerHTML = '<div style="color:#f87171;font-size:12px;">Cannot connect to Supabase.</div>'; });
}

  function restoreBackup(id, label) {
    customConfirm('Restore backup from "' + label + '"?', 'Current data will be overwritten!').then(function(ok) {
      if (!ok) return;
      fetch('/api/admin/restore/' + id, {method:'POST'})
        .then(function(r){return r.json();})
        .then(function(d){
          if (d.success) {
            showBackupMsg('✓ Restored backup from ' + d.restored, '#22c55e');
          } else {
            showBackupMsg('✗ ' + d.error, '#ef4444');
          }
        })
        .catch(function(){ showBackupMsg('✗ Connection error', '#ef4444'); });
    });
  }

const ctx = document.getElementById('siteChart').getContext('2d');
new Chart(ctx, {
  type: 'line',
  data: {
    labels,
    datasets: [
      {
        label: 'Views',
        data: viewsData,
        borderColor: '#60a5fa',
        backgroundColor: makeGradient(ctx, 'rgba(96,165,250,0.3)', 'rgba(96,165,250,0.01)'),
        borderWidth: 2.5, tension: 0.42, fill: true,
        pointRadius: 3, pointBackgroundColor: '#60a5fa', pointHoverRadius: 5,
      },
      {
        label: 'Downloads',
        data: dlData,
        borderColor: '#4ade80',
        backgroundColor: makeGradient(ctx, 'rgba(74,222,128,0.2)', 'rgba(74,222,128,0.01)'),
        borderWidth: 2.5, tension: 0.42, fill: true,
        pointRadius: 3, pointBackgroundColor: '#4ade80', pointHoverRadius: 5,
      }
    ]
  },
  options: {
    responsive: true, maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: { labels: { color: '#a0a0b0', font: { size: 12 }, boxWidth: 12, boxHeight: 12 } },
      tooltip: {
        backgroundColor: 'rgba(14,14,22,0.95)', borderColor: 'rgba(255,255,255,0.1)',
        borderWidth: 1, titleColor: '#f0f0f5', bodyColor: '#a0a0b0', padding: 12,
      }
    },
    scales: {
      x: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#606070', font: { size: 11 } } },
      y: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#606070', font: { size: 11 }, precision: 0 }, beginAtZero: true }
    }
  }
});

  var bhAllBackups = [];
  var bhBarChart = null, bhPieChart = null;

  function loadBackupFull() {
    var btn = document.getElementById('bhRefreshBtn');
    if (btn) { btn.disabled = true; }
    fetch('/api/admin/backups?limit=50')
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (btn) btn.disabled = false;
        if (!d.success) { showBackupMsg('✗ ' + (d.error || 'Error'), '#ef4444'); return; }
        bhAllBackups = d.backups || [];
        renderBhStats(bhAllBackups);
        renderBhCharts(bhAllBackups);
        applyBhFilters();
      })
      .catch(function(){
        if (btn) btn.disabled = false;
        showBackupMsg('✗ Connection error', '#ef4444');
      });
  }

  function renderBhStats(backups) {
    var auto = backups.filter(function(b){ return b.label === 'Auto'; }).length;
    var manual = backups.length - auto;
    document.getElementById('bhStatTotal').textContent = backups.length;
    document.getElementById('bhStatAuto').textContent = auto;
    document.getElementById('bhStatManual').textContent = manual;
    if (backups.length) {
      var dt = new Date(backups[0].created_at);
      document.getElementById('bhStatLast').textContent = dt.toLocaleDateString('en-US', {month:'short',day:'numeric',year:'numeric'});
      // also update old status
      updateLastBackupStatus(backups[0]);
    } else {
      document.getElementById('bhStatLast').textContent = 'None yet';
      updateLastBackupStatus(null);
    }
  }

  function renderBhCharts(backups) {
    // Bar chart — backups per day last 30 days
    var days = 30, barLabels = [], autoData = [], manualData = [];
    for (var i = days - 1; i >= 0; i--) {
      var d = new Date(); d.setDate(d.getDate() - i);
      var key = d.toISOString().slice(0, 10);
      barLabels.push(d.toLocaleDateString('en-US', {month:'short',day:'numeric'}));
      var day = backups.filter(function(b){ return b.created_at.slice(0,10) === key; });
      autoData.push(day.filter(function(b){ return b.label === 'Auto'; }).length);
      manualData.push(day.filter(function(b){ return b.label !== 'Auto'; }).length);
    }
    var barCtx = document.getElementById('bhBarChart').getContext('2d');
    if (bhBarChart) bhBarChart.destroy();
    bhBarChart = new Chart(barCtx, {
      type: 'bar',
      data: {
        labels: barLabels,
        datasets: [
          { label: 'Auto', data: autoData, backgroundColor: 'rgba(148,163,184,.5)', borderRadius: 3 },
          { label: 'Manual', data: manualData, backgroundColor: 'rgba(96,165,250,.7)', borderRadius: 3 }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { labels: { color: '#64748b', font: { size: 10 }, boxWidth: 10, boxHeight: 10 } } },
        scales: {
          x: { stacked: true, ticks: { color: '#475569', font: { size: 9 }, maxTicksLimit: 8 }, grid: { color: 'rgba(255,255,255,.03)' } },
          y: { stacked: true, ticks: { color: '#475569', font: { size: 10 }, stepSize: 1, precision: 0 }, grid: { color: 'rgba(255,255,255,.03)' }, beginAtZero: true }
        }
      }
    });

    // Donut chart
    var auto = backups.filter(function(b){ return b.label === 'Auto'; }).length;
    var manual = backups.length - auto;
    var pieCtx = document.getElementById('bhPieChart').getContext('2d');
    if (bhPieChart) bhPieChart.destroy();
    if (!backups.length) {
      bhPieChart = new Chart(pieCtx, {
        type: 'doughnut',
        data: { labels: ['No backups'], datasets: [{ data: [1], backgroundColor: ['#1e293b'], borderWidth: 0 }] },
        options: { responsive: true, maintainAspectRatio: false, cutout: '65%', plugins: { legend: { labels: { color: '#475569', font: { size: 10 } } } } }
      });
      return;
    }
    bhPieChart = new Chart(pieCtx, {
      type: 'doughnut',
      data: {
        labels: ['Auto', 'Manual'],
        datasets: [{ data: [auto, manual], backgroundColor: ['rgba(148,163,184,.55)', 'rgba(96,165,250,.75)'], borderWidth: 0 }]
      },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: '62%',
        plugins: { legend: { labels: { color: '#94a3b8', font: { size: 10 }, padding: 10, boxWidth: 10, boxHeight: 10 } } }
      }
    });
  }

  function applyBhFilters() {
    var search = (document.getElementById('bhSearch').value || '').trim().toLowerCase();
    var type   = document.getElementById('bhType').value;
    var from   = document.getElementById('bhDateFrom').value;
    var to     = document.getElementById('bhDateTo').value;
    var filtered = bhAllBackups.filter(function(b) {
      if (type && b.label !== type) return false;
      if (from && b.created_at.slice(0,10) < from) return false;
      if (to   && b.created_at.slice(0,10) > to)   return false;
      if (search && b.label.toLowerCase().indexOf(search) === -1 && b.id.toLowerCase().indexOf(search) === -1) return false;
      return true;
    });
    var countEl = document.getElementById('bhFilterCount');
    if (countEl) {
      countEl.textContent = (filtered.length < bhAllBackups.length)
        ? 'Showing ' + filtered.length + ' of ' + bhAllBackups.length : '';
    }
    renderBhTable(filtered);
  }

  function clearBhFilters() {
    document.getElementById('bhSearch').value = '';
    document.getElementById('bhType').value = '';
    document.getElementById('bhDateFrom').value = '';
    document.getElementById('bhDateTo').value = '';
    applyBhFilters();
  }

  function renderBhTable(backups) {
    var body = document.getElementById('bhTableBody');
    if (!backups.length) {
      body.innerHTML = '<div style="padding:24px;text-align:center;color:var(--text3);font-size:12px;">No backups match your filters.</div>';
      return;
    }
    body.innerHTML = backups.map(function(b) {
      var dt = new Date(b.created_at).toLocaleString('en-US', {month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'});
      var badge = b.label === 'Auto'
        ? '<span style="font-size:10px;background:#1e293b;color:#94a3b8;border-radius:4px;padding:2px 7px;font-weight:600;">Auto</span>'
        : '<span style="font-size:10px;background:#1e3a5f;color:#60a5fa;border-radius:4px;padding:2px 7px;font-weight:600;">Manual</span>';
      return '<div style="display:grid;grid-template-columns:80px 1fr 100px 90px;padding:9px 14px;border-bottom:1px solid #0f172a;font-size:12px;color:var(--text2);align-items:center;transition:background .12s;" onmouseover="this.style.background='#060b14'" onmouseout="this.style.background=''">'
        + badge
        + '<span>' + dt + '</span>'
        + '<span style="color:#475569;font-family:monospace;font-size:11px;" title="' + b.id + '">' + b.id.slice(0,8) + '…</span>'
        + '<div style="display:flex;gap:5px;">'
        + '<button class="bh-restore" data-id="' + b.id + '" data-time="' + dt.replace(/"/g,"&quot;") + '" style="padding:3px 9px;border-radius:5px;background:#0f4c81;color:#60a5fa;border:none;cursor:pointer;font-size:11px;font-family:inherit;">Restore</button>'
        + '<button class="bh-delete" data-id="' + b.id + '" style="padding:3px 7px;border-radius:5px;background:#450a0a;color:#f87171;border:none;cursor:pointer;font-size:11px;font-family:inherit;">✕</button>'
        + '</div></div>';
    }).join('');
    body.querySelectorAll('.bh-restore').forEach(function(btn) {
      btn.addEventListener('click', function() {
        customConfirm('Restore backup from "' + btn.dataset.time + '"?', 'Current data will be overwritten!').then(function(ok) {
          if (!ok) return;
          fetch('/api/admin/restore/' + btn.dataset.id, { method: 'POST' })
            .then(function(r){ return r.json(); })
            .then(function(d){ showBackupMsg(d.success ? '✓ Restored successfully!' : '✗ ' + d.error, d.success ? '#22c55e' : '#ef4444'); })
            .catch(function(){ showBackupMsg('✗ Connection error', '#ef4444'); });
        });
      });
    });
    body.querySelectorAll('.bh-delete').forEach(function(btn) {
      btn.addEventListener('click', function() {
        customConfirm('Delete this backup?', 'This action cannot be undone.').then(function(ok) {
          if (!ok) return;
          btn.disabled = true;
          fetch('/api/admin/backup/' + btn.dataset.id, { method: 'DELETE' })
            .then(function(r){ return r.json(); })
            .then(function(d){
              if (d.success) loadBackupFull();
              else { btn.disabled = false; showBackupMsg('✗ ' + d.error, '#ef4444'); }
            }).catch(function(){ btn.disabled = false; });
        });
      });
    });
  }
</script>
{% endblock %}
